[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "table-extractor-local"
version = "0.1.0"
description = "Extracao de tabelas em imagens com IA e validacao local"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3,<3", "truststore>=0.10,<1", "Pillow>=10.1,<13", "openpyxl>=3.1,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ui = ["streamlit>=1.40,<2"]

[project.scripts]
table-extractor = "table_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
